# Builds a signed release APK and publishes it as a GitHub release.
# Trigger: push a tag like v1.2.3 (Obtainium picks up the new release automatically).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias inside the keystore
#   SIGNING_KEY_PASSWORD     key password
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write # create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Work out version from the tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]} MINOR=${BASH_REMATCH[2]} PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::Minor and patch must be <= 99 (versionCode = major*10000 + minor*100 + patch)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Never publish a debug-signed APK: updates would fail to install over it.
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing signing secret ($v). See README → Releasing."; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE_FILE"
          ./gradlew assembleRelease
          rm -f "$SIGNING_KEYSTORE_FILE"

      - name: Verify signature and rename
        id: apk
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SRC=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$SRC" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::APK is debug-signed"; exit 1
          fi
          OUT="VideoDelay-${{ steps.version.outputs.tag }}.apk"
          mv "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "cert=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Video Delay ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            Install or update with [Obtainium](https://github.com/ImranR98/Obtainium) (see the README), or download the APK below.

            Signing certificate SHA-256: `${{ steps.apk.outputs.cert }}`
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
